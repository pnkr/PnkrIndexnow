PLG_CONTENT_PNKRINDEXNOW="Content - Pnkr IndexNow"
PLG_CONTENT_PNKRINDEXNOW_XML_DESCRIPTION="Automatically notifies search engines via IndexNow API when articles are saved or published. IndexNow is a protocol that allows websites to instantly inform search engines about latest content changes."

; Configuration fields
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_LABEL="IndexNow API Key"
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_DESC="Your IndexNow API key: 8 to 128 letters, digits or dashes (for example a random UUID). The key file is created in your site root when you save these settings."
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_INVALID="The IndexNow API key must be 8 to 128 characters long and contain only letters, digits and dashes."

PLG_CONTENT_PNKRINDEXNOW_FIELD_SEARCH_ENGINE_LABEL="Search Engine Endpoint"
PLG_CONTENT_PNKRINDEXNOW_FIELD_SEARCH_ENGINE_DESC="Select which search engine endpoint to use. api.indexnow.org notifies all participating search engines."

PLG_CONTENT_PNKRINDEXNOW_FIELD_PUBLISH_ONLY_LABEL="Notify Only on Published Articles"
PLG_CONTENT_PNKRINDEXNOW_FIELD_PUBLISH_ONLY_DESC="When enabled, only published articles inside their publishing dates trigger IndexNow notifications. Articles that guests cannot view are never submitted."

PLG_CONTENT_PNKRINDEXNOW_FIELD_NOTIFY_REMOVE_LABEL="Notify on Unpublish/Delete"
PLG_CONTENT_PNKRINDEXNOW_FIELD_NOTIFY_REMOVE_DESC="Submit the URL again when an article is unpublished, trashed or deleted, so search engines recrawl it and drop it from their index."

PLG_CONTENT_PNKRINDEXNOW_FIELD_DEBUG_MODE_LABEL="Debug Mode"
PLG_CONTENT_PNKRINDEXNOW_FIELD_DEBUG_MODE_DESC="Show diagnostic messages in the administrator and write detailed entries to the log file administrator/logs/plg_content_pnkrindexnow.php."

; Response messages
PLG_CONTENT_PNKRINDEXNOW_MSG_SUCCESS="IndexNow: Successfully submitted %s to search engines."
PLG_CONTENT_PNKRINDEXNOW_MSG_ACCEPTED="IndexNow: %s accepted and will be processed."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_BAD_REQUEST="IndexNow Error: Invalid request format. Please check your configuration."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_FORBIDDEN="IndexNow Error: API key not valid. Please verify your key file is accessible at your domain root (e.g., https://yoursite.com/your-key.txt)."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_UNPROCESSABLE="IndexNow Error: URL doesn't belong to your domain or key schema mismatch. Please verify your settings."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_TOO_MANY="IndexNow Warning: Too many requests. Please wait before submitting more URLs."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_UNKNOWN="IndexNow: Unexpected response (Status: %d). Please check the plugin log file."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_EXCEPTION="IndexNow Error: %s"
PLG_CONTENT_PNKRINDEXNOW_MSG_REMOVED="IndexNow: Change submitted for removed %s."
PLG_CONTENT_PNKRINDEXNOW_MSG_REMOVED_ACCEPTED="IndexNow: Change for removed %s accepted and will be processed."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_KEYFILE_CREATE="IndexNow Error: Could not create the key file in your site root. Check that the web server can write to the root directory and that no other file with the same name exists."
