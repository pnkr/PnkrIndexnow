PLG_CONTENT_PNKRINDEXNOW="Περιεχόμενο - Pnkr IndexNow"
PLG_CONTENT_PNKRINDEXNOW_XML_DESCRIPTION="Ειδοποιεί αυτόματα τις μηχανές αναζήτησης μέσω του IndexNow API όταν τα άρθρα αποθηκεύονται ή δημοσιεύονται. Το IndexNow είναι ένα πρωτόκολλο που επιτρέπει στους ιστότοπους να ενημερώνουν άμεσα τις μηχανές αναζήτησης σχετικά με τις τελευταίες αλλαγές περιεχομένου."

; Configuration fields
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_LABEL="IndexNow API Key"
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_DESC="Το IndexNow API key σας: 8 έως 128 γράμματα, αριθμοί ή παύλες (π.χ. ένα τυχαίο UUID). Το αρχείο κλειδιού δημιουργείται στη ρίζα του ιστότοπου όταν αποθηκεύετε τις ρυθμίσεις."
PLG_CONTENT_PNKRINDEXNOW_FIELD_API_KEY_INVALID="Το IndexNow API key πρέπει να έχει μήκος 8 έως 128 χαρακτήρες και να περιέχει μόνο γράμματα, αριθμούς και παύλες."

PLG_CONTENT_PNKRINDEXNOW_FIELD_SEARCH_ENGINE_LABEL="Σημείο Πρόσβασης Μηχανής Αναζήτησης"
PLG_CONTENT_PNKRINDEXNOW_FIELD_SEARCH_ENGINE_DESC="Επιλέξτε ποιο σημείο πρόσβασης μηχανής αναζήτησης να χρησιμοποιηθεί. Το api.indexnow.org ειδοποιεί όλες τις συμμετέχουσες μηχανές αναζήτησης."

PLG_CONTENT_PNKRINDEXNOW_FIELD_PUBLISH_ONLY_LABEL="Ειδοποίηση Μόνο για Δημοσιευμένα Άρθρα"
PLG_CONTENT_PNKRINDEXNOW_FIELD_PUBLISH_ONLY_DESC="Όταν είναι ενεργοποιημένο, μόνο τα δημοσιευμένα άρθρα εντός των ημερομηνιών δημοσίευσης ενεργοποιούν ειδοποιήσεις IndexNow. Άρθρα που δεν είναι ορατά στους επισκέπτες δεν υποβάλλονται ποτέ."

PLG_CONTENT_PNKRINDEXNOW_FIELD_NOTIFY_REMOVE_LABEL="Ειδοποίηση σε απόσυρση/διαγραφή"
PLG_CONTENT_PNKRINDEXNOW_FIELD_NOTIFY_REMOVE_DESC="Υποβολή του URL ξανά όταν ένα άρθρο αποσύρεται, μεταφέρεται στα απορρίμματα ή διαγράφεται, ώστε οι μηχανές αναζήτησης να το επανελέγξουν και να το αφαιρέσουν από το ευρετήριο."

PLG_CONTENT_PNKRINDEXNOW_FIELD_DEBUG_MODE_LABEL="Λειτουργία Αποσφαλμάτωσης"
PLG_CONTENT_PNKRINDEXNOW_FIELD_DEBUG_MODE_DESC="Εμφάνιση διαγνωστικών μηνυμάτων στη διαχείριση και καταγραφή λεπτομερειών στο αρχείο administrator/logs/plg_content_pnkrindexnow.php."

; Response messages
PLG_CONTENT_PNKRINDEXNOW_MSG_SUCCESS="IndexNow: Επιτυχής υποβολή %s στις μηχανές αναζήτησης."
PLG_CONTENT_PNKRINDEXNOW_MSG_ACCEPTED="IndexNow: Το %s έγινε αποδεκτό και θα υποβληθεί σε επεξεργασία."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_BAD_REQUEST="Σφάλμα IndexNow: Μη έγκυρη μορφή αιτήματος. Παρακαλώ ελέγξτε τις ρυθμίσεις σας."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_FORBIDDEN="Σφάλμα IndexNow: Το API key δεν είναι έγκυρο. Παρακαλώ βεβαιωθείτε ότι το αρχείο κλειδιού σας είναι προσβάσιμο στη ρίζα του domain σας (π.χ. https://yoursite.com/your-key.txt)."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_UNPROCESSABLE="Σφάλμα IndexNow: Το URL δεν ανήκει στο domain σας ή υπάρχει ασυμφωνία στο σχήμα κλειδιού. Παρακαλώ ελέγξτε τις ρυθμίσεις σας."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_TOO_MANY="Προειδοποίηση IndexNow: Πάρα πολλά αιτήματα. Παρακαλώ περιμένετε πριν υποβάλετε περισσότερα URL."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_UNKNOWN="IndexNow: Μη αναμενόμενη απάντηση (Κατάσταση: %d). Παρακαλώ ελέγξτε το αρχείο καταγραφής του πρόσθετου."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_EXCEPTION="Σφάλμα IndexNow: %s"
PLG_CONTENT_PNKRINDEXNOW_MSG_REMOVED="IndexNow: Υποβλήθηκε η αλλαγή για το αφαιρεμένο %s."
PLG_CONTENT_PNKRINDEXNOW_MSG_REMOVED_ACCEPTED="IndexNow: Η αλλαγή για το αφαιρεμένο %s έγινε αποδεκτή και θα υποβληθεί σε επεξεργασία."
PLG_CONTENT_PNKRINDEXNOW_MSG_ERROR_KEYFILE_CREATE="Σφάλμα IndexNow: Δεν ήταν δυνατή η δημιουργία του αρχείου κλειδιού στη ρίζα του ιστότοπου. Ελέγξτε ότι ο web server μπορεί να γράψει στον ριζικό κατάλογο και ότι δεν υπάρχει άλλο αρχείο με το ίδιο όνομα."
